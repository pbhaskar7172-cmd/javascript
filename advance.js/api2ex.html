<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Finder</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0d1117;
            color: #f0f6fc;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 400px;
            padding: 30px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);

            text-align: center;
        }

        h1 {
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            color: #8b949e;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input {
            flex: 1;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: white;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #58a6ff;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #238636;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2ea043;
        }

        #profile {
            display: none;
            padding-top: 10px;
        }

        #avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid #30363d;
            margin-bottom: 15px;
        }

        #username {
            font-size: 24px;
            margin-bottom: 12px;
        }

        #followers {
            display: inline-block;
            padding: 8px 14px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 20px;
            color: #8b949e;
        }

        .error {
            color: #f85149;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>GitHub Profile</h1>

        <p class="subtitle">
            Search for any GitHub user
        </p>

        <div class="search-box">
            <input
                type="text"
                id="usernameInput"
                placeholder="Enter username..."
            >

            <button id="searchBtn">
                Search
            </button>
        </div>

        <div id="profile">

            <img id="avatar" alt="GitHub Profile">

            <h2 id="username"></h2>

            <p id="followers"></p>

        </div>

        <p id="error" class="error">
            User not found!
        </p>

    </div>


    <script>

        document.querySelector('#searchBtn').onclick = function () {

            const username =
                document.querySelector('#usernameInput').value.trim();

            if (username === "") {
                return;
            }

            const requestUrl =
                `https://api.github.com/users/${username}`;

            const xhr = new XMLHttpRequest();

            xhr.open('GET', requestUrl);

            xhr.onreadystatechange = function () {

                if (xhr.readyState === 4) {

                    if (xhr.status === 200) {

                        const data =
                            JSON.parse(xhr.responseText);

                        // Show profile
                        document.querySelector('#profile').style.display =
                            'block';

                        // Remove error
                        document.querySelector('#error').style.display =
                            'none';

                        // Set image
                        document.querySelector('#avatar').src =
                            data.avatar_url;

                        // Set username
                        document.querySelector('#username').innerText =
                            data.login;

                        // Set followers
                        document.querySelector('#followers').innerText =
                            `Followers: ${data.followers}`;

                    } else {

                        document.querySelector('#profile').style.display =
                            'none';

                        document.querySelector('#error').style.display =
                            'block';
                    }
                }
            };

            xhr.send();
        };

    </script>

</body>
</html>
