<script>

    setTimeout( changetext , 2000);     // we did not use the changetext() as we want to exectue after 2 sec , that will be done by the timeout , if we would have used the () then immediate efecct would have happened  , now the question will be if we want to give the input in the () , then how to give that , so we can use the arrow function , and then call the actualk functuion in that arrow fucntion , see in the html3

    // //()=>{

    const addfxn =  function() {
         const z = document.createElement("div")

    }

   const st =  setTimeout( addfxn, 5000)

   // We can stop the scheduled timeout using clearTimeout().

// clearTimeout() is used to cancel a timeout
// that was previously scheduled using setTimeout().


   // clearTimeout(st);  // it stops , immediatly , no change occur by adding the element , so we want to stop it wehn we have some event

  document.querySelector('#stop').addEventListener('click' , function(e) {

         clearTimeout(st);
